<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slime Civ</title>
<style>
  :root { --bg:#0b0e13; --panel:rgba(16,21,28,.92); --line:#2a3441; --text:#dbe3ec; --dim:#8b97a6; --accent:#7fd1a0; --btn:#1b232d; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body { background:var(--bg); color:var(--text); overflow:hidden;
         font:13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { display:block; position:fixed; inset:0; }
  canvas.dragging { cursor:grabbing; }
  button { background:var(--btn); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:2px 9px; font:inherit; cursor:pointer; }
  button:hover:not(:disabled) { border-color:#4a5a6e; background:#243040; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button.on { background:var(--accent); color:#0b0e13; border-color:var(--accent); }
  kbd { font:inherit; font-size:12px; color:var(--dim); border:1px solid var(--line); border-radius:3px; padding:0 4px; }
  .dim { color:var(--dim); } .dim2 { color:var(--dim); font-size:12px; }
  input[type=number] { background:#0f141b; color:var(--text); border:1px solid var(--line); border-radius:3px; padding:1px 4px; font:inherit; width:64px; }

  #topbar { position:fixed; top:0; left:0; right:0; height:36px; display:flex; gap:8px; align-items:center; white-space:nowrap;
            padding:0 12px; background:var(--panel); border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; z-index:5; }
  #topbar .tb-time { font-weight:600; flex:none; }
  #topbar .tb-pop { overflow:hidden; text-overflow:ellipsis; min-width:0; flex:0 1 auto; }
  #topbar .tb-speed { flex:none; } #topbar .tb-skip { flex:none; }
  #topbar button { padding:2px 6px; font-size:12.5px; }
  #topbar .tb-ov .dim { display:none; }
  #topbar .tb-speed { display:flex; gap:3px; }
  #topbar .tb-spacer { flex:1; }
  #topbar .tb-pop.alarm { color:#ffb259; font-weight:600; }
  #topbar .tb-ov { display:flex; gap:3px; align-items:center; }
  #topbar .tb-ov .dim { margin-right:3px; }
  .tb-menuwrap { position:relative; }
  .tb-menu { position:absolute; right:0; top:30px; width:300px; background:#121820; border:1px solid var(--line); border-radius:6px; padding:8px; z-index:9; }
  .tb-menu button[data-m] { display:block; width:100%; text-align:left; margin-bottom:4px; }
  .tb-menu .mrow { display:flex; gap:8px; align-items:center; margin:8px 0 4px; }
  .tb-menu label.mrow { gap:6px; }

  .col { position:fixed; top:42px; bottom:30px; width:318px; overflow-y:auto; z-index:3; display:flex; flex-direction:column; gap:6px; scrollbar-width:thin; pointer-events:none; }
  .col > * { pointer-events:auto; }
  #colL { left:8px; } #colR { right:8px; }
  body.nopanels .col, body.nopanels #notables { display:none !important; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:6px; flex:none; }
  .panel > header { display:flex; gap:6px; padding:5px 9px; cursor:pointer; user-select:none; font-weight:600; border-bottom:1px solid var(--line); }
  .panel > header .phint { margin-left:auto; color:var(--dim); font-weight:400; font-size:12px; }
  .panel.closed > header { border-bottom:0; } .panel.closed > .pbody { display:none; }
  .pbody { padding:7px 9px 9px; }
  .pbody p { margin:3px 0; }
  .sub { margin:9px 0 3px; color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  .chronbody { max-height:250px; overflow-y:auto; scrollbar-width:thin; }

  .bar { position:relative; height:16px; background:#0f141b; border:1px solid #232d39; border-radius:3px; overflow:hidden; min-width:60px; }
  .bar > i { position:absolute; left:0; top:0; bottom:0; }
  .bar > span { position:relative; display:block; text-align:right; padding-right:4px; font-size:11.5px; line-height:14px; text-shadow:0 0 3px #000, 0 0 3px #000; }
  .bar .mk { position:absolute; top:0; bottom:0; width:2px; margin-left:-1px; background:rgba(255,255,255,.55); }
  .bar .mk.crit { background:#ff5d5d; } .bar .mk.soft { background:#ffd166; } .bar .mk.tgt { background:#fff; width:3px; } .bar .mk.mid { background:rgba(255,255,255,.35); }
  .grid { display:grid; grid-template-columns:78px 1fr; gap:3px 8px; align-items:center; }
  .kv { display:grid; grid-template-columns:78px 1fr; gap:2px 8px; margin-top:7px; }
  .kv span { color:var(--dim); } .kv b { font-weight:500; }
  .kv.big { grid-template-columns:auto auto 1fr; align-items:baseline; margin:0; } .kv.big b { font-size:18px; }
  .seasonline { margin:4px 0; font-weight:500; }
  .warn { margin:6px 0 0; padding:5px 7px; border-radius:4px; background:rgba(255,209,102,.12); border:1px solid rgba(255,209,102,.4); }
  .warn.l2 { background:rgba(229,89,79,.15); border-color:rgba(229,89,79,.55); } .warn b { color:#ffb259; } .warn.l2 b { color:#ff7d72; }
  .srow { display:grid; grid-template-columns:92px 1fr; gap:0 8px; align-items:center; padding:2px 3px; border-radius:4px; cursor:pointer; margin:0 -3px; }
  .srow:hover { background:#1a222c; } .srow.sel { background:#1f2b38; outline:1px solid #3b4d62; }
  .srow .ss { grid-column:2; font-size:11.5px; color:#c9a2ff; margin:0 0 2px; min-height:0; } .srow .ss:empty { display:none; } .srow .ss .dim { margin-left:6px; }
  .keepedit { margin:6px 0 2px; padding:7px; background:#141b24; border:1px solid #33445a; border-radius:5px; }
  .keepedit .edtitle { font-weight:600; margin-bottom:5px; } .keepedit .edrow { display:flex; gap:4px; align-items:center; } .keepedit .edhelp { margin-top:5px; font-size:12px; }

  .badge { display:inline-block; padding:0 6px; border-radius:9px; color:#0b0e13; font-weight:700; font-size:11.5px; vertical-align:1px; }
  .whysent { font-size:14px; line-height:1.45; }
  details.parts { margin:8px 0 0; } details summary { cursor:pointer; color:var(--dim); }
  details table { margin:4px 0; border-collapse:collapse; width:100%; } details td { padding:1px 4px; } td.num { text-align:right; font-variant-numeric:tabular-nums; } td.neg { color:#ff8a80; }
  ul.rej { margin:0 0 0 16px; } ul.rej li { margin:2px 0; }
  .chips { display:flex; flex-wrap:wrap; gap:3px; margin-bottom:6px; } .chips button { padding:0 7px 0 4px; display:flex; align-items:center; gap:4px; } .chips i, i.blob { width:11px; height:11px; border-radius:50%; display:inline-block; border:1px solid rgba(0,0,0,.5); }
  .idrow { display:flex; gap:8px; align-items:flex-start; } .idrow i.blob { width:22px; height:22px; margin-top:2px; flex:none; }
  .btnrow { display:flex; gap:5px; margin:6px 0 0; } i.star { color:#ffd166; font-style:normal; }

  #notables { position:fixed; top:40px; left:336px; right:336px; display:flex; flex-wrap:wrap; gap:4px; z-index:3; pointer-events:none; }
  #notables > * { pointer-events:auto; }
  .nt { display:flex; align-items:center; gap:4px; background:var(--panel); padding:1px 6px 1px 4px; border-radius:12px; }
  .nt.on { border-color:#ffe27a; box-shadow:0 0 0 1px #ffe27a; }
  .nt .nn { font-size:12px; } .nt i.blob { width:14px; height:14px; } .nt i.kid { width:10px; height:10px; }
  .nt .al { display:flex; gap:2px; } .nt u { text-decoration:none; font-size:10.5px; font-weight:800; color:#0b0e13; border-radius:3px; padding:0 3px; line-height:14px; }
  .more { align-self:center; color:var(--dim); font-size:12px; background:var(--panel); padding:1px 7px; border-radius:10px; }

  #possbanner { position:fixed; top:48px; left:50%; transform:translateX(-50%); display:none; background:rgba(40,28,64,.96); border:2px solid #c9a2ff; padding:6px 12px; border-radius:8px; z-index:6; max-width:min(760px, calc(100vw - 720px)); min-width:420px; }
  #possbanner .pb-head { display:flex; gap:10px; align-items:baseline; } #possbanner .pb-head b { color:#e6d4ff; font-size:15px; letter-spacing:.06em; } #possbanner .pb-head button { margin-left:auto; }
  #possbanner .pb-needs { display:grid; grid-template-columns:auto 1fr auto 1fr auto 1fr; gap:3px 8px; margin:5px 0; align-items:center; font-size:12px; } #possbanner .bar { min-width:60px; }
  #possbanner .pb-line { font-size:12.5px; } #possbanner .pb-fb { color:#ffb259; } #possbanner .pb-hint { font-size:11.5px; color:var(--dim); margin-top:3px; }
  .tb-skip { display:inline-flex; gap:4px; align-items:center; margin-left:10px; } .tb-prog { position:fixed; top:40px; left:50%; transform:translateX(-50%); background:rgba(40,36,16,.95); border:1px solid #ffe27a; border-radius:6px; padding:3px 12px; color:#ffe27a; font-size:13px; z-index:6; } .tb-prog:empty { display:none; }

  #orderbar { position:fixed; bottom:34px; left:50%; transform:translateX(-50%); display:none; gap:6px; align-items:center; background:var(--panel); border:1px solid var(--line); padding:6px 10px; border-radius:8px; z-index:4; }
  #orderbar .ob-verbs { display:flex; gap:3px; } .ob-count { font-weight:600; margin-right:4px; white-space:nowrap; } #orderbar button { white-space:nowrap; }
  .ctxmenu { position:fixed; z-index:8; background:#121820; border:1px solid #3b4d62; border-radius:6px; padding:4px; display:flex; flex-direction:column; gap:3px; }
  .ctxmenu button { text-align:left; min-width:170px; }


  #buildbar { position:fixed; bottom:34px; left:50%; transform:translateX(-50%); display:none; background:var(--panel); border:1px solid var(--line); padding:6px 10px; border-radius:8px; z-index:4; max-width:calc(100vw - 700px); min-width:520px; }

  #buildbar .bb-row { display:flex; gap:4px; align-items:center; flex-wrap:wrap; margin-bottom:5px; }
  #buildbar .bb-lvl { margin:0 2px 0 10px; font-variant-numeric:tabular-nums; color:var(--dim); }
  #buildbar .bb-done { margin-left:8px; }
  #buildbar .bb-opts { gap:12px; } #buildbar .bb-opts > span { display:flex; gap:3px; align-items:center; }

  #digest .dg-close { float:right; } .dgl { margin-top:6px; }
  .ce { padding:2px 0; border-bottom:1px solid #1d2630; } .ce[data-a] { cursor:pointer; } .ce[data-a]:hover { background:#1a222c; }
  .ce .when { color:var(--dim); font-size:11.5px; margin-right:4px; white-space:nowrap; } .ce.s2 { color:#ffb1a8; } .ce.s2 .when { color:#c98279; } .ce.s0 { color:#aab4c0; }

  #toasts { position:fixed; bottom:100px; left:50%; transform:translateX(-50%); z-index:7; display:flex; flex-direction:column; gap:4px; align-items:center; pointer-events:none; }
  .toast { background:rgba(24,32,42,.96); border:1px solid #3b4d62; border-radius:6px; padding:5px 12px; max-width:560px; }
  #tip { position:fixed; display:none; z-index:6; pointer-events:none; background:rgba(10,14,19,.95); border:1px solid #3b4d62; border-radius:5px; padding:4px 8px; max-width:280px; }
  #footer { position:fixed; bottom:6px; left:12px; right:12px; display:flex; justify-content:space-between; color:var(--dim); font-size:12px; pointer-events:none; text-shadow:0 0 4px #000, 0 0 4px #000; z-index:2; }

  #helpOverlay { position:fixed; inset:0; background:rgba(5,8,12,.72); z-index:10; display:none; align-items:center; justify-content:center; }
  .helpcard { width:720px; max-width:94vw; max-height:90vh; overflow-y:auto; background:#121820; border:1px solid #3b4d62; border-radius:10px; padding:16px 22px; position:relative; }
  .helpcard h2 { margin-bottom:6px; } .helpcard h3 { margin:12px 0 4px; color:var(--accent); } .helpcard ol { margin-left:20px; } .helpcard li { margin:3px 0; }
  .helpcard table td { padding:2px 10px 2px 0; vertical-align:top; } .hclose { position:absolute; top:12px; right:14px; }

      else if (carryRoom(v, item) <= 0) { c.blocker = "NO_CAPACITY"; c.mk = () => ({ blocker: "NO_CAPACITY" }); c.tid = best.id; }
      else { c.tid = best.id; c.d = bd; c.mk = oneStep("haul", "pickup", best); }
      if (full && !c.blocker) c.blocker = "MAX_WORKERS";
      add(ctx, c);
    }
    function chopCand(ctx, base, full) {
      const near = nearPlants(ctx), t = near.tree, v = ctx.v;
      const g = { ...base, kind: "chop", skill: "chop" };
      if (v.carry) { g.blocker = "NO_CAPACITY"; g.mk = () => ({ blocker: "NO_CAPACITY" }); }
      else if (!t) { g.blocker = near.rsv.tree ? "RESERVED" : "NO_MATERIAL"; g.mk = () => ({ blocker: g.blocker }); }
      else { g.tid = t.id; g.d = dTo(ctx, t); g.mk = oneStep("chop", "chop", t); }
      if (full && !g.blocker) g.blocker = "MAX_WORKERS";
      add(ctx, g);
    }
    function gatherCand(ctx, base, full) {
      const near = nearPlants(ctx), t = near.tuft, v = ctx.v;
      const g = { ...base, kind: "cut", skill: "gather" };
      if (carryRoom(v, "grass") <= 0) { g.blocker = "NO_CAPACITY"; g.mk = () => ({ blocker: "NO_CAPACITY" }); }
      else if (!t) { g.blocker = near.rsv.tuft ? "RESERVED" : "NO_MATERIAL"; g.mk = () => ({ blocker: g.blocker }); }
      else { g.tid = t.id; g.d = dTo(ctx, t); g.mk = oneStep("cut", "cut", t); }
      if (full && !g.blocker) g.blocker = "MAX_WORKERS";
      add(ctx, g);
    }
    
    // ---- hauling baseline (§09 R21) ------------------------------------------------
    
    function genHaul(ctx, clsFor) {
      const { v, sim } = ctx;
      if (v.carry) {
        const cap = carryCap(v);
        const cls = clsFor(v.carry.item);
        const c = { kind: "store", cls: cls.cls, kp: cls.kp, grp: cls.kp ? "kp:" + cls.kp : "haul", urg: Math.max(0.2, carryLoad(v) / cap), d: 0, key: "store:0" };
        const cell = storeCell(sim, v.carry.item, v.x, v.y);
        if (!cell && ITEMS[v.carry.item].food === 0) {                  // the food-only cells are all that is left: set the load down rather than stand there with full hands
          c.d = 0; c.key = "store:dump"; c.cls = "vcrit"; c.uv = 0; c.grp = "dump";     // full hands also block foraging, so setting the load down is as urgent as the food chain
          c.mk = () => ({ task: Task("store", [{ v: "dump", ...HERE }]), res: [] });
        } else if (!cell) { c.blocker = "NO_STORAGE"; c.mk = () => ({ blocker: "NO_STORAGE" }); }
        else {
          c.d = dist3(v.x, v.y, v.z, cell[0], cell[1], cell[2]);
          c.mk = () => {
            const st = { x: cell[0], y: cell[1], z: cell[2] };
            return reach(ctx, st) ? { task: Task("store", [{ v: "drop", ...st }]), res: [] } : { blocker: "NO_PATH" };
          };
        }
        add(ctx, c);
      }
      // Loose stacks outside the zone: nearest one I can lift.
      const canStore = {};
      let best = null, bd = 1e9, rsv = 0;
      const items = sim.ents.ofKind("item");
      for (let i = 0; i < items.length; i++) {
        const s = items[i];
        if (inZone(sim.stock, s.x, s.y) || carryRoom(v, s.item) <= 0) continue;
        if (!(s.item in canStore)) canStore[s.item] = storeCell(sim, s.item, v.x, v.y) !== null;
        if (!canStore[s.item]) continue;                                 // nowhere to put it: leave it where it lies
        if (reservedByOther(sim, s, v.id)) { rsv++; continue; }
        if (isBad(v, s.id, ctx.t)) continue;
        const d = dTo(ctx, s);
        if (d < bd && d <= MAX_SCAN) { bd = d; best = s; }
      }
      if (best) {
        const cls = clsFor(best.item);
        const h = { kind: "haul", cls: cls.cls, kp: cls.kp, grp: cls.kp ? "kp:" + cls.kp : "haul", urg: 0.6, tid: best.id, d: bd, mk: oneStep("haul", "pickup", best) };
        add(ctx, h);
      }
    }
    
    // ---- construction: derived build jobs at STANDING class (§09, §12.6) ----------------
    
    /** The next ghost to work, its materials fetched from the stockpile, delivered, then finished. */
    function genConstruct(ctx) {
      const { sim, v, sv } = ctx, rs = readySites(sim);
      if (!rs.total) return;
      const cap = Math.max(1, Math.ceil(HAND_CAP * ctx.vl.adults));
      const base = { cls: "standing", urg: 0.5, grp: "construct", skill: "build" };
      const full = capped(ctx, "standing", "construct", cap);
      let best = null, bk = 1e9, rsv = 0;
      for (const s of rs.ready) {
        if (reservedByOther(sim, s, v.id)) { rsv++; continue; }
        if (isBad(v, s.id, ctx.t)) continue;
        const k = TIER[s.w] * 1000 + dTo(ctx, s) - (s.rv === v.id ? 5000 : 0);
        if (k < bk) { bk = k; best = s; }
      }
      const c = { ...base, kind: "build_site", key: "build_site:" + (best ? best.id : 0) };
      if (!best) {
        c.blocker = rs.ready.length === 0 && rs.waiting ? "UNSUPPORTED" : rsv ? "RESERVED" : "NO_PATH";
        c.mk = () => ({ blocker: c.blocker }); add(ctx, c); return;
      }
      const cost = costOf(best.w, best.m), need = Math.max(0, cost.n - best.got);
      const holds = need === 0 || (v.carry && v.carry.item === cost.item && v.carry.n >= need);
      c.tid = best.id; c.d = dTo(ctx, best);
      if (!holds && v.carry) c.blocker = "NO_CAPACITY";
      else if (!holds && sv.stock[cost.item] < need) c.blocker = "NO_MATERIAL";
      else if (full) c.blocker = "MAX_WORKERS";
      if (c.blocker) c.mk = () => ({ blocker: c.blocker });
      else c.mk = () => {
        let stand = null, sd = 1e9;
        for (const [x, y, z] of standCells(sim, best)) { const d = dist3(v.x, v.y, v.z, x, y, z); if (d < sd) { sd = d; stand = { x, y, z }; } }
        if (!stand || !reach(ctx, stand)) return { blocker: "NO_PATH" };
        const steps = [];
        if (!holds) {
          const stack = stockStack(ctx, cost.item);
          if (!stack || !reach(ctx, stack)) return { blocker: "NO_MATERIAL" };
          steps.push({ v: "take", item: cost.item, n: need, ...stack });
        }
        if (need > 0) steps.push({ v: "deliver", tid: best.id, item: cost.item, n: need, ...stand });
        steps.push({ v: "construct", tid: best.id, dur: cost.dur, ...stand });
        return { task: Task("build_site", steps), res: [best] };
      };
      add(ctx, c);
      if (c.blocker === "NO_MATERIAL") {
        c.short = cost.item;                                     // the Why panel says which one
        if (sv.loose[cost.item] > 0) looseCand(ctx, base, cost.item, full);
        if (sv.stock[cost.item] + sv.loose[cost.item] + sv.carried[cost.item] < need) {
          if (cost.item === "grass") gatherCand(ctx, base, full);
          else if (cost.item === "stick" || cost.item === "log") chopCand(ctx, base, full);
          // stone and dirt come only from digging, which is the player's order (R8: no autonomous quarrying)
        }
      }
    }
    
    /** Marked pieces (S4b): take the nearest one down. Same standing class and hand cap as building. */
    function genDeconstruct(ctx) {
      const { sim, v } = ctx, ds = sim.ents.ofKind("dsite");
      if (!ds.length) return;
      const cap = Math.max(1, Math.ceil(HAND_CAP * ctx.vl.adults));
      let best = null, bd = 1e9, rsv = 0;
      for (const d of ds) {
        if (reservedByOther(sim, d, v.id)) { rsv++; continue; }
        if (isBad(v, d.id, ctx.t)) continue;
        const dd = dTo(ctx, d) - (d.rv === v.id ? 1000 : 0);
        if (dd < bd) { bd = dd; best = d; }
      }
      const c = { cls: "standing", urg: 0.4, grp: "construct", kind: "deconstruct", skill: null, key: "deconstruct:" + (best ? best.id : 0) };
      if (!best) { c.blocker = rsv ? "RESERVED" : "NO_PATH"; c.mk = () => ({ blocker: c.blocker }); add(ctx, c); return; }
      c.tid = best.id; c.d = dTo(ctx, best);
      if (capped(ctx, "standing", "construct", cap)) c.blocker = "MAX_WORKERS";
      if (c.blocker) c.mk = () => ({ blocker: c.blocker });
      else c.mk = () => {
        let stand = null, sd = 1e9;
        const solid = best.w === "wall";                       // a wall's own cell is filled: stand beside it
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
          if (solid && dx === 0 && dy === 0) continue;
          const x = best.x + dx, y = best.y + dy;
          if (!sim.world.isWalkable(x, y, best.z)) continue;
          const d = dist3(v.x, v.y, v.z, x, y, best.z);
          if (d < sd) { sd = d; stand = { x, y, z: best.z }; }
        }
        if (!stand || !reach(ctx, stand)) { v.bad.push([best.id, ctx.t + 600]); return { blocker: "NO_PATH" }; }
        return { task: Task("deconstruct", [{ v: "unbuild", tid: best.id, dur: UNBUILD_DUR[best.w], ...stand }]), res: [best] };
      };
      add(ctx, c);
    }
    
    // ---- village-level critical, standing, demand, orders ------------------------------
    
    function genVillage(ctx) {
      const b = ctx.b;
      if (b.fc) foodChain(ctx, "vcrit", { uv: b.uvf, urg: 1, cap: b.fneed, grp: "food", urgDry: 1 });
      if (b.sc) buildChain(ctx, "vcrit", "bed", { uv: b.uvs, urg: 1, cap: Math.max(1, b.sneed), grp: "shelter" });
      // food-critical with too few racks (none, or fresh food piling up unsaved): a rack is part of the cure (derived, same class)
      if (b.fc && b.dem.rack > 0 && (!ctx.vl.racks.length || ctx.sv.stock.berry >= 8)) buildChain(ctx, "vcrit", "rack", { uv: 1, urg: 1, cap: 1, grp: "rack" });     // no rack = no banking: ahead of foraging
    }
    
    // Keep-N for non-food items must not eat the village's hands (S4b playtest fix, GDD §09 hand cap):
    // derived keep-N jobs use at most HAND_CAP of the adults, and while food is short (demand above
    // KEEP_FOOD_DEM, i.e. the larder is under the season's look-ahead target, or beds/racks are wanted) at most KEEP_FOOD_SHARE of them,
    // so foraging at demand class keeps getting workers even though a standing order outranks it.
    const KEEP_FOOD_DEM = 0.0;
    const KEEP_FOOD_SHARE = 0.2;
    const FOOD_KP = new Set(["berry", "dried"]);
    
    /** Are the non-food keep-N jobs (chop, gather, haul of kept items) already using their share of the hands? */
    function keepFull(ctx) {
      const b = ctx.b, adults = Math.max(1, ctx.vl.adults);
      let kw = 0;                                                    // other villagers already on non-food keep-N work
      for (const k in ctx.w) if (k.startsWith("standing:kp:") && !FOOD_KP.has(k.slice(12))) kw += ctx.w[k];
      const pressed = b.dem.food > KEEP_FOOD_DEM || b.dem.shelter > 0 || b.dem.rack > 0;     // the village has its own work to do
      return kw >= Math.max(1, Math.floor((pressed ? KEEP_FOOD_SHARE : HAND_CAP) * adults));
    }
    
    function genStanding(ctx) {
      const b = ctx.b, kfull = keepFull(ctx);
      for (const k of b.keeps) {
        if (!k.on) continue;
        const have = ctx.sv.stock[k.item] + ctx.sv.loose[k.item] + ctx.sv.carried[k.item];
        const base = { cls: "standing", urg: clamp(1 - have / k.n, 0, 1), grp: "kp:" + k.item, kp: k.item };
        const food = FOOD_KP.has(k.item);
        const full = capped(ctx, "standing", base.grp, 3) || (!food && kfull);     // maxWorkers per standing order (§09 default 3)
        if (k.item === "berry") foodChain(ctx, "standing", { urg: base.urg, cap: 3, grp: base.grp, kp: k.item, dry: false });
        else if (k.item === "dried") { foodChain(ctx, "standing", { urg: base.urg, cap: 3, grp: base.grp, kp: k.item }); }
        else if (k.item === "grass") gatherCand(ctx, base, full);
        else chopCand(ctx, base, full);                              // stick, log
      }
    }
    
    function genDemand(ctx) {
      const { b, vl } = ctx, adults = Math.max(1, vl.adults);
      if (b.dem.food > 0) {
        const cap = Math.max(1, Math.ceil(b.dem.food * Math.max(1, FOOD_WORKERS * adults)));
        foodChain(ctx, "demand", { urg: b.dem.food, urgDry: Math.max(b.dem.preserve, b.dem.food), cap, grp: "food" });
      } else if (b.dem.preserve > 0) foodChain(ctx, "demand", { urg: b.dem.preserve, cap: 2, grp: "food", forage: false });
      if (b.dem.shelter > 0) buildChain(ctx, "demand", "bed", { urg: b.dem.shelter, cap: Math.max(1, Math.min(2, b.sneed)), grp: "shelter" });
      if (b.dem.rack > 0) buildChain(ctx, "demand", "rack", { urg: b.dem.rack, cap: 1, grp: "rack" });
    }
    
    const ORDER_SKILL = { forage: "gather", chop: "chop", gather: "gather", haul: null, move: null, dig: null };
    const ORDER_SPECIES = { forage: "berry", chop: "tree", gather: "tuft" };
    
    /** Targets of an area order: its named entity if still valid, else the nearest valid one within ORDER_AREA. */
    function orderTarget(ctx, o) {
      const { sim, v, t } = ctx;
      const season = berrySeason(t);
      const want = ORDER_SPECIES[o.verb];
      let best = null, bd = 1e9, any = false, rsv = 0;
      const ok = (e) => want === "berry" ? e.yield > 0 && season : want === "tuft" ? e.yield > 0 : true;
      const consider = (e) => {
        if (Math.abs(e.x - o.x) > ORDER_AREA || Math.abs(e.y - o.y) > ORDER_AREA) return;
        any = true;
        if (reservedByOther(sim, e, v.id)) { rsv++; return; }
        if (isBad(v, e.id, t)) return;
        const d = dTo(ctx, e) - (e.id === o.tid ? 1000 : 0);
        if (d < bd) { bd = d; best = e; }
      };
      if (o.verb === "haul") {
        for (const s of sim.ents.ofKind("item")) if (!inZone(sim.stock, s.x, s.y) && carryRoom(v, s.item) > 0) consider(s);
      } else {
        for (const p of sim.ents.ofKind("plant")) if (p.species === want && ok(p)) consider(p);
      }
      return { e: best, any, rsv };
    }
    
    /** Dig order: the diggable cells at the ordered level inside a small patch; stand beside one and take it out. */
    function genDig(ctx, base) {
      const { sim, v, t } = ctx, o = v.order, w = sim.world;
      let best = null, bd = 1e9;
      for (let dy = -DIG_AREA; dy <= DIG_AREA; dy++) for (let dx = -DIG_AREA; dx <= DIG_AREA; dx++) {
        const x = o.x + dx, y = o.y + dy;
        if (!diggable(sim, x, y, o.z) || isBad(v, DIG_BAD + World.idx(x, y, o.z), t)) continue;
        const d = dist3(v.x, v.y, v.z, x, y, o.z);
        if (d < bd) { bd = d; best = [x, y, o.z]; }
      }
      if (!best) {
        let any = false;
        for (let dy = -DIG_AREA; dy <= DIG_AREA && !any; dy++) for (let dx = -DIG_AREA; dx <= DIG_AREA; dx++) if (diggable(sim, o.x + dx, o.y + dy, o.z)) { any = true; break; }
        if (!any) { if (!ctx.dry) { v.order = null; ctx.b.ep++; } return; }     // nothing left to dig here: order complete
        add(ctx, { ...base, kind: "dig", blocker: "NO_PATH", mk: () => ({ blocker: "NO_PATH" }) });
        return;
      }
      const [cx, cy, cz] = best, bad = DIG_BAD + World.idx(cx, cy, cz);
      const c = { ...base, kind: "dig", key: "dig:" + bad, d: bd };
      c.mk = () => {
        let stand = null, sd = 1e9;
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) for (const dz of [1, 0]) {
          const x = cx + dx, y = cy + dy, z = cz + dz;
          if (!w.isWalkable(x, y, z)) continue;
          const d = dist3(v.x, v.y, v.z, x, y, z);
          if (d < sd) { sd = d; stand = { x, y, z }; }
        }
        if (!stand || !reach(ctx, stand)) { v.bad.push([bad, ctx.t + 600]); return { blocker: "NO_PATH" }; }
        return { task: Task("dig", [{ v: "dig", cx, cy, cz, ...stand }]), res: [] };
      };
      add(ctx, c);
    }
    const DIG_BAD = 10000000;           // "bad target" ids for cells live above any entity id
    
    function genOrder(ctx) {
      const { v, sim, t } = ctx, o = v.order;
      if (!o) return;
      const base = { cls: "order", urg: clamp((t - o.t0) / 900, 0, 1), grp: "order", skill: ORDER_SKILL[o.verb] };
      if (o.verb === "dig") { genDig(ctx, base); return; }
      if (o.verb === "move") {
        const c = { ...base, kind: "goto", key: "goto:0", d: dist3(v.x, v.y, v.z, o.x, o.y, o.z) };
        c.mk = () => {
          const st = { x: o.x, y: o.y, z: o.z };
          if (!sim.world.isWalkable(st.x, st.y, st.z)) return { blocker: "NO_PATH" };
          return reach(ctx, st) ? { task: Task("goto", [{ v: "goto", ...st }]), res: [] } : { blocker: "NO_PATH" };
        };
        add(ctx, c);
        return;
      }
      const kind = o.verb === "forage" ? "forage" : o.verb === "chop" ? "chop" : o.verb === "gather" ? "cut" : "haul";
      const { e, any, rsv } = orderTarget(ctx, o);
      const c = { ...base, kind };
      const carryOk = o.verb === "chop" ? !v.carry : o.verb === "haul" ? true : carryRoom(v, ORDER_SPECIES[o.verb] === "berry" ? "berry" : "grass") > 0;
      if (!e) {
        if (!any && (o.verb !== "forage" || berrySeason(t))) { v.order = null; ctx.b.ep++; return; }     // area exhausted: order complete
        c.blocker = o.verb === "forage" && !berrySeason(t) ? "NO_SEASON" : rsv ? "RESERVED" : "NO_TARGET";
        c.mk = () => ({ blocker: c.blocker });
      } else if (!carryOk) { c.blocker = "NO_CAPACITY"; c.mk = () => ({ blocker: c.blocker }); c.tid = e.id; }
      else {
        c.tid = e.id; c.d = dTo(ctx, e);
        c.mk = oneStep(kind, o.verb === "forage" ? "pick" : o.verb === "chop" ? "chop" : o.verb === "gather" ? "cut" : "pickup", e);
      }
      add(ctx, c);
    }
    
    // ---- scoring -----------------------------------------------------------------
    
    function temper(v, kind) { return mix32(v.id, kh(kind)) / 4294967296; }     // 0..1; term = 5*(2h-1) = +/-5
    
    function scoreCand(ctx, c) {
      const { v } = ctx;
      const base = c.cls === "need" ? 400 * c.u - (NEED_RANK[c.kind] || 0) : c.cls === "vcrit" ? 350 + 50 * (c.uv || 0) : BASE[c.cls];
      const d = c.d || 0;
      const p = {
        base,
        urg: c.cls === "need" || c.cls === "vcrit" ? 0 : 30 * (c.urg || 0),     // classBase already carries the urgency of a critical job
        fit: c.skill ? 60 * level(v, c.skill) : 0,
        prox: c.cls === "need" ? 0 : 10 * clamp(1 - d / MAX_SCAN, 0, 1),         // needs: distance is n/a (a thirsty villager walks as far as it must)
        path: c.cls === "need" ? 0 : -Math.min(20, d * 0.2),
        pref: c.skill && c.skill === ctx.pref ? 10 : 0,
        tmp: c.cls === "standing" || c.cls === "demand" || c.cls === "leisure" ? 5 * (2 * temper(v, c.kind) - 1) : 0,   // orders bypass temper (R5)
        sw: 0,
      };
      const cur = ctx.cur;
      if (cur && c.key !== cur.key && ctx.t - cur.t0 < COMMIT && c.cls !== "vcrit" && !(c.cls === "need" && c.u > 0.5)) p.sw = -SWITCH_COST;
      const within = clamp(p.urg + p.fit + p.prox + p.path + p.pref + p.tmp + p.sw, -WITHIN_CLAMP, WITHIN_CLAMP);
      c.parts = p; c.score = c.cls === "vcrit" ? Math.min(VCRIT_CAP, base + within) : base + within;
      // Low mood pre-empts orders (§08) but not a hungry village: leisure may not outrank village-critical.
      if (c.cls === "need" && c.kind === "leisure") c.score = Math.min(c.score, MOOD_CAP);
    }
    
    // ---- the decision -------------------------------------------------------------
    
    /**
     * Score everything, take the best candidate that can actually run, and record
     * why. With replan=true, keeps the running action when it is still the best.
     * Returns true if a (new) action was assigned.
     */
    function plan(sim, v, replan, probe, dry) {
      const ctx = makeCtx(sim, v, dry);
      const adult = isAdult(sim, v);
      genNeeds(ctx);
      if (adult) {
        genVillage(ctx); genOrder(ctx); genStanding(ctx); genConstruct(ctx); genDeconstruct(ctx); genDemand(ctx);
        genHaul(ctx, (item) => {
          const k = sim.board.keeps.find(q => q.item === item && q.on);
          return k ? { cls: "standing", kp: item } : { cls: "demand", kp: "" };
        });
      }
      add(ctx, { kind: "leisure", cls: "leisure", urg: (1 - v.mood) * 0.5, grp: "leisure", d: 0, key: "leisure:0", mk: () => ({ task: Wander(), res: [] }) });
    
      for (const c of ctx.cands) scoreCand(ctx, c);
      if (probe) probe(ctx.cands);                      // tests/debugging: see every scored candidate
      const ready = ctx.cands.filter(c => !c.blocker).sort((a, b) => b.score - a.score || (a.key < b.key ? -1 : 1));
      const rej = ctx.cands.filter(c => c.blocker);
    
      let chosen = null, made = null, tries = 0;
      if (dry) chosen = ready[0];                       // a preview picks the best-scored runnable job without building anything
      else for (const c of ready) {
        if (replan && ctx.cur && c.key === ctx.cur.key) { chosen = c; made = null; break; }
        if (++tries > 6) break;
        const r = c.mk(ctx);
        if (r.blocker) { c.blocker = r.blocker; rej.push(c); continue; }
        chosen = c; made = r; break;
      }
      if (!chosen) { chosen = ready[ready.length - 1]; made = { task: Wander(), res: [] }; }   // leisure is always last resort
    
      // Alternatives that lost: blocked ones keep their blocker, outscored ones say why.
      const crit = chosen.cls === "need" || chosen.cls === "vcrit";
      const alts = rej.slice();

    game.fastForward = (n) => { game.skipper.cancel("Stopped."); for (let i = 0; i < n; i++) game.sim.step(); return game.sim.tick; };
    /** Synchronous skip-to ("morning" | "season" | "event") with the same stop rules as the buttons. Returns the stop message. */
    game.skipTo = (kind, maxTicks = 400000) => {
      if (!game.skipper.start(kind)) return "";
      game.skipper.run(1e9, maxTicks);
      if (game.skipper.active) game.skipper.cancel("Stopped: tick limit.");
      return game.skipper.msg;
    };
    game.togglePause = () => { game.state.paused = !game.state.paused; };
    game.toast = (msg, ms = 3500) => {
      const root = $("toasts"), last = root.lastChild;
      if (last && last.textContent === msg) { last.classList.remove("toast"); void last.offsetWidth; last.classList.add("toast"); return; }     // the same message again (e.g. planning four beds): show it once
      const el = document.createElement("div");
      el.className = "toast"; el.textContent = msg; root.appendChild(el);
      while (root.children.length > 4) root.firstChild.remove();
      setTimeout(() => el.remove(), ms);
    };
    function sync() {                       // keep focus inside the selection
      const ui = game.ui;
      if (!ui.sel.includes(ui.focus)) ui.focus = ui.sel[0] || 0;
      if (ui.sel.length) ui.other = null;
    }
    function reveal(v) {                    // bring a villager into view if it is off-screen
      const [sx, sy] = cam.toScreen(v.x + 0.5, v.y + 0.5);
      if (sx < 360 || sx > cam.vw - 360 || sy < 80 || sy > cam.vh - 80) { cam.x = v.x + 0.5; cam.y = v.y + 0.5; }
      if (renderer.z < v.z) renderer.setZ(v.z);
    }
    game.selectOnly = (id, center) => {
      const v = game.sim.ents.get(id); if (!v) return;
      game.ui.sel = [id]; game.ui.focus = id; game.ui.other = null; sync();
      if (center) reveal(v);
    };
    game.selectMany = (ids) => { game.ui.sel = ids.slice(); game.ui.other = null; sync(); };
    game.toggleSelect = (id) => {
      const s = game.ui.sel, i = s.indexOf(id);
      if (i >= 0) s.splice(i, 1); else s.push(id);
      game.ui.focus = i >= 0 ? s[0] || 0 : id; sync();
    };
    /** Cancel orders (through the sim) and remember it, so "order finished" toasts only fire for orders that ran out by themselves. */
    game.cancelOrders = (ids) => {
      const ok = game.sim.apply({ type: "cancel", ids: ids.slice() });
      for (const id of ids) orderSeen.delete(id);
      game.toast(ok ? "Orders cancelled." : "No orders to cancel.");
      return ok;
    };
    const orderSeen = new Map();             // villager id -> verb of the order seen last frame
    /** Toast when an order ends on its own (area cleared / arrived), grouped by verb. */
    function orderEnds(sim) {
      const done = {};
      for (const v of sim.ents.ofKind("villager")) {
        const had = orderSeen.get(v.id);
        if (v.order) orderSeen.set(v.id, v.order.verb);
        else if (had) { orderSeen.delete(v.id); if (had !== "move") (done[had] = done[had] || []).push(v.name); }
      }
      for (const verb in done) game.toast(`${verb[0].toUpperCase() + verb.slice(1)} order finished: ${done[verb].join(", ")} (nothing left to do in the area).`);
    }
    /** Switch input mode; modes may define enter(game) / leave(game). */
    game.setMode = (m) => {
      const ui = game.ui, old = game.modes[ui.mode];
      if (m === ui.mode) return;
      if (old && old.leave) old.leave(game);
      ui.mode = m; ui.targeting = null;
      const nu = game.modes[m];
      if (nu && nu.enter) nu.enter(game);
    };
    game.clearSelection = () => { game.ui.sel = []; game.ui.focus = 0; game.ui.other = null; game.ui.follow = 0; game.ui.targeting = null; };
    game.selectOther = (o) => { game.ui.sel = []; game.ui.focus = 0; game.ui.other = o; };
    /** Replace the whole sim (load / new game). */
    game.setSim = (sim) => {
      game.setMode("select");
      game.sim = sim;
      game.clearSelection();
      game.skipper.active = null;
      const ui = game.ui, es = sim.chron.entries;
      ui.digest = null; ui.attn = { tick: sim.tick, id: es.length ? es[es.length - 1].id : 0 }; ui.toastedId = ui.attn.id; ui.markers = []; ui.editKeep = null;
      game.state.paused = true;
      orderSeen.clear();
      possessCtl.resume();                    // a loaded save may be mid-possession
    };
    
    createSkip(game);
    const possessCtl = createPossess(game);
    
    // ---- DOM ----
    const bar = createTopBar($("topbar"), game);
    const colL = $("colL"), colR = $("colR");
    const village = createVillagePanel(colL, game);
    const bps = createBlueprintPanel(colL, game);
    const chron = createChroniclePanel(colL, game);
    const why = createWhyPanel(colR, game);
    const insp = createInspector(colR, game);
    const notables = createNotables($("notables"), game);
    const orderbar = createOrderBar($("orderbar"), game);
    const buildbar = createBuildMode(game, $("buildbar"));
    const digest = createDigest($("digest"), game);
    const help = createHelp($("helpOverlay"), game);
    const tip = $("tip");
    document.addEventListener("click", (e) => { const b = e.target.closest && e.target.closest("button"); if (b && !(b instanceof HTMLInputElement)) b.blur(); });   // so Space pauses, not "presses" the last button
    
    function resize() { renderer.resize(); }
    window.addEventListener("resize", resize);
    resize();
    // Start centred on the clearing (nudged left of the side panels), zoomed to show a village-sized patch.
    cam.zoom = Math.min(24, Math.max(8, Math.floor(Math.min(cam.vw, cam.vh) / 40)));
    cam.x = 64 + 150 / cam.zoom; cam.y = 64;
    setupInput(game, canvas);
    
    function tooltip() {
      const { sim, ui } = game, h = ui.hover;
      let text = "";
      if (h && ui.mouse && ui.mouse.over && !ui.press && !ui.box) {
        if (h.villager) {
          const x = explain(sim, h.villager);
          text = describe(sim, h.villager) + (x ? "\n" + x.headline : "");
        } else if (h.ents.length) text = h.ents.map(e => describe(sim, e)).join("\n");
        else if (h.kind === "stock") text = "Stockpile - where food and materials are kept";
      }
      if (!text) { tip.style.display = "none"; return; }
      tip.style.display = "block";
      if (tip.dataset.t !== text) { tip.dataset.t = text; tip.innerHTML = text.split("\n").map(esc).join("<br>"); }
      tip.style.left = Math.min(ui.mouse.x + 14, cam.vw - tip.offsetWidth - 8) + "px";
      tip.style.top = Math.min(ui.mouse.y + 16, cam.vh - tip.offsetHeight - 8) + "px";
    }
    
    // ---- loop ----
    let acc = 0, prev = performance.now(), panelT = 0, lastDraw = 0;
    function frame(now) {
      const dtMs = Math.min(250, now - prev); prev = now;
      const { state, ui } = game;
      state.fps += (1000 / Math.max(1, dtMs) - state.fps) * 0.1;
      const sim = game.sim;
    
      let ran = false;
      if (game.skipper.active) {
        game.skipper.run(SLICE_MS); ran = true;
      } else if (!state.paused) {
        const sp = game.effectiveSpeed();
        if (sp === Infinity) {                                      // MAX: as many ticks as fit in SLICE_MS
          const t0 = performance.now(); let n = 0;
          do { sim.step(); n++; } while ((n & 15) !== 0 || performance.now() - t0 < SLICE_MS);
          state.msPerTick += ((performance.now() - t0) / n - state.msPerTick) * 0.1; acc = 0; ran = true;
        } else {
          const tickMs = 1000 / (TICKS_PER_SEC * sp), cap = Math.max(MAX_TICKS_PER_FRAME, Math.ceil(sp * TICKS_PER_SEC * 0.25));
          acc = Math.min(acc + dtMs, tickMs * cap);
          const t0 = performance.now();
          let n = 0;
          while (acc >= tickMs && n < cap) {
            sim.step(); acc -= tickMs; n++;
            if (performance.now() - t0 > TIME_BUDGET_MS) { acc = 0; break; }
          }
          if (n) state.msPerTick += ((performance.now() - t0) / n - state.msPerTick) * 0.1;
          ran = n > 0;
        }
      } else acc = 0;
    
      // Drop selections of villagers that died.
      const live = ui.sel.filter(id => sim.ents.get(id));
      if (live.length !== ui.sel.length) { ui.sel = live; sync(); }
      if (ui.other && ui.other.kind === "entity" && !sim.ents.get(ui.other.id)) ui.other = null;
    
      panKeys(game, dtMs / 1000);
      possessCtl.frame();
      watch(game);
      orderEnds(sim);
      const fast = game.skipper.active || (ran && game.effectiveSpeed() === Infinity);
      if (!fast || now - lastDraw > DRAW_MS_FAST) {
        lastDraw = now;
        renderer.draw(sim, { zones: ui.overlays.zones || ui.hoverStock || (ui.other && ui.other.kind === "stock") });
        drawOverlays(game);
      }
    
      if (now - panelT > PANEL_MS) {
        panelT = now;
        const sv = survey(sim), vs = sim.ents.ofKind("villager");
        const popText = `Pop ${vs.length}  ·  food ${sv.rations} (${sim.board.runway >= 99 ? "-" : sim.board.runway.toFixed(1)} d)`
          + (sim.board.fc ? "  ·  FOOD LOW" : "") + (sim.board.sc ? "  ·  NEEDS SHELTER" : "");
        bar.update({ tick: sim.tick, popText });
        possessCtl.update();
        village.update(); bps.update(); buildbar.update(); chron.update(); why.update(); insp.update(); notables.update(); orderbar.update(); digest.update(); help.update();
        $("perf").textContent = `${state.fps.toFixed(0)} fps · ${state.msPerTick.toFixed(2)} ms/tick · seed ${sim.seed} · tick ${sim.tick} · z ${renderer.z}`;
        $("hint").textContent = game.possessed() ? "Guiding a villager: WASD walk · E / click use what is next to you · Esc release" : ui.mode === "build" ? "Build mode: drag to plan, R rotates a stamp, [ ] changes level, Esc leaves" : ui.targeting ? "Click the map to place the order" : ui.sel.length ? "Right-click to order · Tab next · F follow · Esc deselect" : "Click a villager to see what it is doing and why · H: help";
        document.body.classList.toggle("building", ui.mode === "build");
        colR.style.display = ui.sel.length || ui.other ? "" : "none";
        canvas.style.cursor = ui.targeting ? "crosshair" : "";
      }
      tooltip();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    
    // Handle for tools/*.js and the console. sim is a getter-like field kept current by setSim.
    window.__game = game;
    game.D = D; game.F = F; game.M = M;
    
    return {};
  })();
})();
</script>
</body>
</html>
