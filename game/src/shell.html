<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slime Civ</title>
<style>
  :root { --bg:#0b0e13; --panel:rgba(16,21,28,.92); --line:#2a3441; --text:#dbe3ec; --dim:#8b97a6; --accent:#7fd1a0; --btn:#1b232d; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body { background:var(--bg); color:var(--text); overflow:hidden;
         font:13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { display:block; position:fixed; inset:0; }
  canvas.dragging { cursor:grabbing; }
  button { background:var(--btn); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:2px 9px; font:inherit; cursor:pointer; }
  button:hover:not(:disabled) { border-color:#4a5a6e; background:#243040; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button.on { background:var(--accent); color:#0b0e13; border-color:var(--accent); }
  kbd { font:inherit; font-size:12px; color:var(--dim); border:1px solid var(--line); border-radius:3px; padding:0 4px; }
  .dim { color:var(--dim); } .dim2 { color:var(--dim); font-size:12px; }
  input[type=number] { background:#0f141b; color:var(--text); border:1px solid var(--line); border-radius:3px; padding:1px 4px; font:inherit; width:64px; }

  #topbar { position:fixed; top:0; left:0; right:0; height:36px; display:flex; gap:8px; align-items:center; white-space:nowrap;
            padding:0 12px; background:var(--panel); border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; z-index:5; }
  #topbar .tb-time { font-weight:600; flex:none; }
  #topbar .tb-pop { overflow:hidden; text-overflow:ellipsis; min-width:0; flex:0 1 auto; }
  #topbar .tb-speed { flex:none; } #topbar .tb-skip { flex:none; }
  #topbar button { padding:2px 6px; font-size:12.5px; }
  #topbar .tb-ov .dim { display:none; }
  #topbar .tb-speed { display:flex; gap:3px; }
  #topbar .tb-spacer { flex:1; }
  #topbar .tb-pop.alarm { color:#ffb259; font-weight:600; }
  #topbar .tb-ov { display:flex; gap:3px; align-items:center; }
  #topbar .tb-ov .dim { margin-right:3px; }
  .tb-menuwrap { position:relative; }
  .tb-menu { position:absolute; right:0; top:30px; width:300px; background:#121820; border:1px solid var(--line); border-radius:6px; padding:8px; z-index:9; }
  .tb-menu button[data-m] { display:block; width:100%; text-align:left; margin-bottom:4px; }
  .tb-menu .mrow { display:flex; gap:8px; align-items:center; margin:8px 0 4px; }
  .tb-menu label.mrow { gap:6px; }

  .col { position:fixed; top:42px; bottom:30px; width:318px; overflow-y:auto; z-index:3; display:flex; flex-direction:column; gap:6px; scrollbar-width:thin; pointer-events:none; }
  .col > * { pointer-events:auto; }
  #colL { left:8px; } #colR { right:8px; }
  body.nopanels .col, body.nopanels #notables { display:none !important; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:6px; flex:none; }
  .panel > header { display:flex; gap:6px; padding:5px 9px; cursor:pointer; user-select:none; font-weight:600; border-bottom:1px solid var(--line); }
  .panel > header .phint { margin-left:auto; color:var(--dim); font-weight:400; font-size:12px; }
  .panel.closed > header { border-bottom:0; } .panel.closed > .pbody { display:none; }
  .pbody { padding:7px 9px 9px; }
  .pbody p { margin:3px 0; }
  .sub { margin:9px 0 3px; color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  .chronbody { max-height:250px; overflow-y:auto; scrollbar-width:thin; }

  .bar { position:relative; height:16px; background:#0f141b; border:1px solid #232d39; border-radius:3px; overflow:hidden; min-width:60px; }
  .bar > i { position:absolute; left:0; top:0; bottom:0; }
  .bar > span { position:relative; display:block; text-align:right; padding-right:4px; font-size:11.5px; line-height:14px; text-shadow:0 0 3px #000, 0 0 3px #000; }
  .bar .mk { position:absolute; top:0; bottom:0; width:2px; margin-left:-1px; background:rgba(255,255,255,.55); }
  .bar .mk.crit { background:#ff5d5d; } .bar .mk.soft { background:#ffd166; } .bar .mk.tgt { background:#fff; width:3px; } .bar .mk.mid { background:rgba(255,255,255,.35); }
  .grid { display:grid; grid-template-columns:78px 1fr; gap:3px 8px; align-items:center; }
  .kv { display:grid; grid-template-columns:78px 1fr; gap:2px 8px; margin-top:7px; }
  .kv span { color:var(--dim); } .kv b { font-weight:500; }
  .kv.big { grid-template-columns:auto auto 1fr; align-items:baseline; margin:0; } .kv.big b { font-size:18px; }
  .seasonline { margin:4px 0; font-weight:500; }
  .warn { margin:6px 0 0; padding:5px 7px; border-radius:4px; background:rgba(255,209,102,.12); border:1px solid rgba(255,209,102,.4); }
  .warn.l2 { background:rgba(229,89,79,.15); border-color:rgba(229,89,79,.55); } .warn b { color:#ffb259; } .warn.l2 b { color:#ff7d72; }
  .srow { display:grid; grid-template-columns:92px 1fr; gap:0 8px; align-items:center; padding:2px 3px; border-radius:4px; cursor:pointer; margin:0 -3px; }
  .srow:hover { background:#1a222c; } .srow.sel { background:#1f2b38; outline:1px solid #3b4d62; }
  .srow .ss { grid-column:2; font-size:11.5px; color:#c9a2ff; margin:0 0 2px; min-height:0; } .srow .ss:empty { display:none; } .srow .ss .dim { margin-left:6px; }
  .keepedit { margin:6px 0 2px; padding:7px; background:#141b24; border:1px solid #33445a; border-radius:5px; }
  .keepedit .edtitle { font-weight:600; margin-bottom:5px; } .keepedit .edrow { display:flex; gap:4px; align-items:center; } .keepedit .edhelp { margin-top:5px; font-size:12px; }

  .badge { display:inline-block; padding:0 6px; border-radius:9px; color:#0b0e13; font-weight:700; font-size:11.5px; vertical-align:1px; }
  .whysent { font-size:14px; line-height:1.45; }
  details.parts { margin:8px 0 0; } details summary { cursor:pointer; color:var(--dim); }
  details table { margin:4px 0; border-collapse:collapse; width:100%; } details td { padding:1px 4px; } td.num { text-align:right; font-variant-numeric:tabular-nums; } td.neg { color:#ff8a80; }
  .panel.flash { outline:2px solid #c9a2ff; }
  .alm-craft { padding:5px 0; border-bottom:1px solid #1d2630; } .alm-craft.lost { opacity:.85; } .alm-holders { display:flex; flex-wrap:wrap; gap:3px; margin-top:3px; }
  .alm-graph { display:grid; grid-template-columns:1fr 1fr; gap:2px 8px; margin:2px 0 6px; } .alm-g { font-size:12px; color:#7a8798; } .alm-g.known { color:#9fd8b0; } .alm-g.open { color:#e0c070; } .alm-g b { display:inline-block; width:1.5em; color:#7a8798; } .alm-ord { margin-bottom:4px; }
  .alm-flow { margin:2px 0 6px; color:#7a8798; } .alm-flow .on { color:#ffd166; font-weight:600; } .alm-flow .past { color:#9fd8b0; }
  .warnline { color:#ffd166; }
  a.lnk { color:#8ec5ff; cursor:pointer; text-decoration:underline dotted; }
  .ttl { display:inline-block; background:#3b3150; border:1px solid #7a5fb0; border-radius:9px; padding:0 7px; margin:1px 2px; font-size:11px; color:#e4d6ff; }
  i.rusty { font-style:normal; font-size:10px; color:#d9a066; border:1px solid #8a6038; border-radius:6px; padding:0 4px; margin-left:3px; }
  .nt .tt { font-size:9px; color:#c9a2ff; margin-left:3px; max-width:90px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .alm-risk { background:rgba(229,89,79,.25); color:#ff9a8f; border:1px solid rgba(229,89,79,.5); border-radius:3px; padding:0 4px; font-size:11px; }
  .alm-curio { margin:4px 0; padding:4px 7px; border-left:3px solid #c9a2ff; background:rgba(201,162,255,.08); }
  pre.alm-trace { margin:4px 0 0; padding:5px; max-height:160px; overflow:auto; font-size:10.5px; line-height:1.35; background:#0c1016; border:1px solid #232d3a; white-space:pre-wrap; }
  ul.rej { margin:0 0 0 16px; } ul.rej li { margin:2px 0; }
  .chips { display:flex; flex-wrap:wrap; gap:3px; margin-bottom:6px; } .chips button { padding:0 7px 0 4px; display:flex; align-items:center; gap:4px; } .chips i, i.blob { width:11px; height:11px; border-radius:50%; display:inline-block; border:1px solid rgba(0,0,0,.5); }
  .idrow { display:flex; gap:8px; align-items:flex-start; } .idrow i.blob { width:22px; height:22px; margin-top:2px; flex:none; }
  .btnrow { display:flex; gap:5px; margin:6px 0 0; } i.star { color:#ffd166; font-style:normal; }

  #notables { position:fixed; top:40px; left:336px; right:336px; display:flex; flex-wrap:wrap; gap:4px; z-index:3; pointer-events:none; }
  #notables > * { pointer-events:auto; }
  #notables.scroll { max-height:46vh; overflow-y:auto; align-content:flex-start; }
  .ntf { display:flex; gap:3px; margin-right:6px; } .ntf button, .ntf-all { font-size:12px; padding:1px 7px; } .ntf button.on, .ntf-all.on { border-color:#ffe27a; }
  .cr-list { max-height:44vh; overflow-y:auto; scrollbar-width:thin; } .cr-tools { margin-bottom:3px; } .cr-chev { padding:0 6px; } .crew.folded { padding:3px 0; } .crew.folded .cr-sum { margin:1px 0 0 22px; }
  .cr-make { display:flex; gap:5px; margin-bottom:6px; } .cr-make input { flex:1; min-width:0; }
  .crew .btnrow { flex-wrap:wrap; } .crew { padding:6px 0; border-bottom:1px solid #1d2630; } .crew select { width:100%; margin-top:4px; } .cr-sum { margin:3px 0; color:#cfe3ff; font-size:12.5px; }
  .cn { display:flex; gap:6px; align-items:flex-start; padding:4px 0; border-bottom:1px solid #1d2630; } .cn .cnt { flex:1; } .cn .cnk { font-weight:700; min-width:64px; }
  .cn .pip { width:9px; height:9px; border-radius:50%; margin-top:5px; flex:none; display:inline-block; }
  .cn .cni { width:18px; text-align:center; flex:none; } .cn.l3 .cnk { color:#ff9a8f; } .cn.l1 { opacity:.82; }
  #panel-concerns .phint.badge { background:#2a3a4c; color:#cfe3ff; border-radius:9px; padding:0 7px; font-weight:700; } #panel-concerns .phint.badge.b3 { background:#8f2f28; color:#fff; } #panel-concerns .phint.badge.b2 { background:#8a6a1c; color:#fff; }
  #advisories { position:fixed; left:336px; top:96px; width:330px; z-index:7; display:flex; flex-direction:column; gap:6px; pointer-events:none; }
  .purposes { flex-wrap:wrap; } .fx { margin:4px 0; color:#d8e6c8; }
  .adv { pointer-events:auto; background:rgba(30,22,22,.97); border:1px solid #a8453c; border-left-width:5px; border-radius:6px; padding:6px 9px; box-shadow:0 2px 10px rgba(0,0,0,.5); }
  .adv .at { font-weight:700; margin-bottom:2px; } .adv .btnrow { margin-top:5px; gap:5px; } .adv button { font-size:12px; padding:1px 8px; }
  .bp .rev { color:#ffd166; } .bp .pushed { color:#9fe3b0; }
  .nt { display:flex; align-items:center; gap:4px; background:var(--panel); padding:1px 6px 1px 4px; border-radius:12px; }
  .nt.on { border-color:#ffe27a; box-shadow:0 0 0 1px #ffe27a; }
  .nt .nn { font-size:12px; } .nt i.blob { width:14px; height:14px; } .nt i.kid { width:10px; height:10px; }
  .nt .al { display:flex; gap:2px; } .nt u { text-decoration:none; font-size:10.5px; font-weight:800; color:#0b0e13; border-radius:3px; padding:0 3px; line-height:14px; }
  .more { align-self:center; color:var(--dim); font-size:12px; background:var(--panel); padding:1px 7px; border-radius:10px; }

  #possbanner { position:fixed; top:48px; left:50%; transform:translateX(-50%); display:none; background:rgba(40,28,64,.96); border:2px solid #c9a2ff; padding:6px 12px; border-radius:8px; z-index:6; max-width:min(760px, calc(100vw - 720px)); min-width:420px; }
  #possbanner .pb-head { display:flex; gap:10px; align-items:baseline; } #possbanner .pb-head b { color:#e6d4ff; font-size:15px; letter-spacing:.06em; } #possbanner .pb-head button { margin-left:auto; }
  #possbanner .pb-needs { display:grid; grid-template-columns:auto 1fr auto 1fr auto 1fr; gap:3px 8px; margin:5px 0; align-items:center; font-size:12px; } #possbanner .bar { min-width:60px; }
  #possbanner .pb-line { font-size:12.5px; } #possbanner .pb-fb { color:#ffb259; } #possbanner .pb-hint { font-size:11.5px; color:var(--dim); margin-top:3px; }
  .tb-skip { display:inline-flex; gap:4px; align-items:center; margin-left:10px; } .tb-prog { position:fixed; top:40px; left:50%; transform:translateX(-50%); background:rgba(40,36,16,.95); border:1px solid #ffe27a; border-radius:6px; padding:3px 12px; color:#ffe27a; font-size:13px; z-index:6; } .tb-prog:empty { display:none; }
  .tb-skip button[disabled] { opacity:.45; }
  #orderbar { position:fixed; bottom:34px; left:50%; transform:translateX(-50%); display:none; gap:6px; align-items:center; background:var(--panel); border:1px solid var(--line); padding:6px 10px; border-radius:8px; z-index:4; }
  #orderbar .ob-verbs { display:flex; gap:3px; } .ob-count { font-weight:600; margin-right:4px; white-space:nowrap; } #orderbar button { white-space:nowrap; }
  .ctxmenu { position:fixed; z-index:8; background:#121820; border:1px solid #3b4d62; border-radius:6px; padding:4px; display:flex; flex-direction:column; gap:3px; }
  .ctxmenu button { text-align:left; min-width:170px; }


  #buildbar { position:fixed; bottom:34px; left:50%; transform:translateX(-50%); display:none; background:var(--panel); border:1px solid var(--line); padding:6px 10px; border-radius:8px; z-index:4; max-width:calc(100vw - 700px); min-width:520px; }
  body.building #toasts { bottom:230px; }
  #buildbar .bb-row { display:flex; gap:4px; align-items:center; flex-wrap:wrap; margin-bottom:5px; }
  #buildbar .bb-lvl { margin:0 2px 0 10px; font-variant-numeric:tabular-nums; color:var(--dim); }
  #buildbar .bb-done { margin-left:8px; }
  #buildbar .bb-opts { gap:12px; } #buildbar .bb-opts > span { display:flex; gap:3px; align-items:center; }
  #buildbar .bb-stamp { gap:10px; } #buildbar select, #buildbar input[type=text] { background:#0f141b; color:var(--text); border:1px solid var(--line); border-radius:3px; padding:1px 4px; font:inherit; }
  #buildbar .bb-status { min-height:18px; font-size:12.5px; } #buildbar .short { color:#ffb259; }
  #buildbar .tool-erase, #buildbar .tool-dig, #buildbar .tool-capture { margin-left:0; }
  #buildbar .tool-erase { margin-left:10px; }
  ul.checks { list-style:none; margin:2px 0 6px; } ul.checks li { margin:3px 0; } ul.checks b { display:inline-block; width:16px; font-weight:800; }
  ul.checks li.ok b { color:#7fd1a0; } ul.checks li.no b { color:#ff7d72; }
  .q-poor { color:#ff9a8a; } .q-adequate { color:#ffd166; } .q-good, .q-fine { color:#7fd1a0; }
  .badge.next { background:#243040; color:#ffe27a; border:1px solid #ffe27a; }
  .bp { padding:5px 0; border-bottom:1px solid #1d2630; } .bp .btnrow { align-items:center; flex-wrap:wrap; } .bp label.auto { font-size:12px; display:flex; gap:3px; align-items:center; }
  .purposes button { flex:1; }

  #digest { position:fixed; top:84px; left:50%; transform:translateX(-50%); width:480px; max-height:60vh; overflow-y:auto; background:#121a24; border:1px solid #4a6a8a; border-radius:8px; padding:10px 12px; z-index:6; display:none; box-shadow:0 6px 30px rgba(0,0,0,.5); }
  #digest .dg-close { float:right; } .dgl { margin-top:6px; }
  .ce { padding:2px 0; border-bottom:1px solid #1d2630; } .ce[data-a] { cursor:pointer; } .ce[data-a]:hover { background:#1a222c; }
  .ce .when { color:var(--dim); font-size:11.5px; margin-right:4px; white-space:nowrap; } .ce.s2 { color:#ffb1a8; } .ce.s2 .when { color:#c98279; } .ce.s0 { color:#aab4c0; }

  #toasts { position:fixed; bottom:100px; left:50%; transform:translateX(-50%); z-index:7; display:flex; flex-direction:column; gap:4px; align-items:center; pointer-events:none; }
  .toast { background:rgba(24,32,42,.96); border:1px solid #3b4d62; border-radius:6px; padding:5px 12px; max-width:560px; }
  #tip { position:fixed; display:none; z-index:6; pointer-events:none; background:rgba(10,14,19,.95); border:1px solid #3b4d62; border-radius:5px; padding:4px 8px; max-width:280px; }
  #footer { position:fixed; bottom:6px; left:12px; right:12px; display:flex; justify-content:space-between; color:var(--dim); font-size:12px; pointer-events:none; text-shadow:0 0 4px #000, 0 0 4px #000; z-index:2; }

  #helpOverlay { position:fixed; inset:0; background:rgba(5,8,12,.72); z-index:10; display:none; align-items:center; justify-content:center; }
  .helpcard { width:720px; max-width:94vw; max-height:90vh; overflow-y:auto; background:#121820; border:1px solid #3b4d62; border-radius:10px; padding:16px 22px; position:relative; }
  .helpcard h2 { margin-bottom:6px; } .helpcard h3 { margin:12px 0 4px; color:var(--accent); } .helpcard ol { margin-left:20px; } .helpcard li { margin:3px 0; }
  .helpcard table td { padding:2px 10px 2px 0; vertical-align:top; } .hclose { position:absolute; top:12px; right:14px; }

  /* S12 accessibility: UI scale (a zoom on the interface, never on the map), high contrast, reduced motion */
  :root { --ui: 1; }
  /* the top bar scales to what fits (ui/access.js fitTopbar) */
  .col, #notables, #orderbar, #buildbar, #possbanner, #helpOverlay, #settingsOverlay, #digest, #toasts, #advisories, .tb-prog { zoom: var(--ui); }
  body.hc { --bg:#000; --panel:rgba(0,0,0,.97); --line:#fff; --text:#fff; --dim:#e2e2e2; --accent:#ffe14a; --btn:#000; }
  body.hc button { border-color:#fff; } body.hc button.on { background:#ffe14a; color:#000; border-color:#ffe14a; } body.hc .panel { border-width:2px; } body.hc .bar { border-color:#fff; }
  body.hc .dim, body.hc .dim2, body.hc .kv span { color:#e2e2e2; } body.hc #possbanner { background:#000; } body.hc .toast { background:#000; border-color:#fff; } body.hc kbd { border-color:#fff; color:#fff; }
  body.hc .helpcard, body.hc .setcard, body.hc .tb-menu, body.hc .ctxmenu { background:#000; border-color:#fff; }
  body.calm *, body.calm *::before { animation:none !important; transition:none !important; }
  #possbanner .pb-haz { color:#ffd166; font-weight:600; margin-top:2px; }
  #settingsOverlay { position:fixed; inset:0; background:rgba(5,8,12,.72); z-index:11; display:none; align-items:center; justify-content:center; }
  .setcard { width:760px; max-width:94vw; max-height:90vh; overflow-y:auto; background:#121820; border:1px solid #3b4d62; border-radius:10px; padding:16px 22px; position:relative; }
  .setcard h2 { margin-bottom:6px; } .setcard h3 { margin:14px 0 4px; color:var(--accent); } .setcard .sclose { position:absolute; top:12px; right:14px; }
  .setcard table { border-collapse:collapse; width:100%; } .setcard td { padding:3px 10px 3px 0; vertical-align:middle; border-bottom:1px solid #1d2630; } .setcard td.act { width:230px; } .setcard td:nth-child(2), .setcard td:nth-child(3) { white-space:nowrap; } .setcard, .helpcard { max-height:calc(90vh / var(--ui, 1)); } .setcard td.note { color:var(--dim); font-size:12px; }
  .setcard tr.hd td { color:var(--accent); font-weight:600; padding-top:10px; border:0; } .setcard tr.cap td button.chg { border-color:#ffe27a; color:#ffe27a; }
  .setcard .acc { display:grid; grid-template-columns:auto 1fr; gap:8px 14px; align-items:center; } .setcard .acc label { display:flex; gap:7px; align-items:center; } .setcard .acc .why { color:var(--dim); font-size:12px; }
  .setcard select { background:#0f141b; color:var(--text); border:1px solid var(--line); border-radius:3px; padding:1px 4px; font:inherit; } .setcard .msg { min-height:18px; color:#ffb259; margin-top:6px; }
  .iron { color:#ff9a8a; font-weight:700; letter-spacing:.05em; }
  .tb-menu .autos { margin:4px 0; } .tb-menu .autos button { font-size:12px; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="topbar"></div>
<div id="notables"></div>
<div id="colL" class="col"></div>
<div id="colR" class="col"></div>
<div id="possbanner"></div>
<div id="orderbar"></div>
<div id="buildbar"></div>
<div id="digest"></div>
<div id="advisories"></div>
<div id="toasts"></div>
<div id="tip"></div>
<div id="footer"><span id="hint"></span><span id="perf"></span></div>
<div id="helpOverlay"></div>
<div id="settingsOverlay"></div>
<script>
/*BUNDLE*/
</script>
</body>
</html>
