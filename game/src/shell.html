<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slime Civ</title>
<style>
  /* ===== Tokens (UI_SPEC §2.1). Dark only; one warm-charcoal theme plus the high-contrast mode. ===== */
  :root { --bg:#0b0e13; --s1:rgba(18,22,28,.92); --s2:#1a2029; --s3:#242c37; --line:#2c3541; --line-hi:#44556a;
          --tx:#e8edf3; --tx2:#a6b2c1; --tx3:#6f7c8c; --sel:#ffd166;
          --danger:#ff6b4a; --warm:#ffa63d; --food:#a7d86a; --water:#56b4e9; --energy:#9a9cff; --ok:#35d0a0; --cold:#b5ecff;
          --sick:#d4e04e; --know:#c79bff; --stand:#e08bd0; --rot:#8a6a4a; --poss:#ffe9a8;
          --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:24px; --r1:4px; --r2:8px; --r3:12px; --rp:999px;
          --e0:0 0 0 1px var(--line), inset 0 1px 0 rgba(255,255,255,.04); --e1:var(--e0), 0 4px 16px rgba(0,0,0,.35); --e2:0 0 0 1px var(--line-hi), 0 8px 28px rgba(0,0,0,.55);
          --colL:264px; --colR:296px; --tb:40px; --ui:1; --u:calc(1px / var(--ui)); --mm:0px;
          /* legacy names: the old class rules below read these, so they follow the tokens (and the high-contrast mode) */
          --panel:var(--s1); --text:var(--tx); --dim:var(--tx2); --accent:var(--ok); --btn:var(--s2); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body { background:var(--bg); color:var(--tx); overflow:hidden; font:13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-variant-numeric:tabular-nums; }
  canvas { display:block; position:fixed; inset:0; }
  canvas.dragging { cursor:grabbing; }
  #glview { z-index:0; } #fadecv { z-index:0; pointer-events:none; opacity:0; } #view { z-index:0; } body.fpv #glview, body.fpv #fadecv { visibility:hidden; }
  .sr { position:absolute !important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap; }
  :focus-visible { outline:2px solid var(--sel); outline-offset:2px; }
  kbd { font:inherit; font-size:11px; color:var(--tx2); background:var(--s2); border:1px solid var(--line-hi); border-bottom-width:2px; border-radius:var(--r1); padding:0 5px; line-height:15px; display:inline-block; }
  .dim { color:var(--tx2); } .dim2 { color:var(--tx2); font-size:12px; }
  svg.ic { flex:none; vertical-align:-3px; } svg.ic use { pointer-events:none; }

  /* ===== buttons (§2.3): one set ===== */
  button, .btn { background:var(--s2); color:var(--tx); border:1px solid var(--line); border-radius:var(--r1); padding:2px 9px; font:inherit; cursor:pointer; min-height:24px; display:inline-flex; align-items:center; gap:6px; transition:background .12s ease-out, border-color .12s ease-out; }
  button:hover:not(:disabled) { border-color:var(--line-hi); background:var(--s3); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button.on { background:var(--s3); border-color:var(--sel); box-shadow:inset 0 -2px 0 var(--sel); }
  button.on svg.ic { color:var(--sel); }
  .btn.ico { width:28px; height:28px; padding:0; justify-content:center; position:relative; }
  .btn.big { width:44px; height:44px; border-radius:var(--r3); } .btn.sm { min-height:24px; height:24px; }
  .btn.pri { color:var(--sel); background:var(--s3); box-shadow:inset 0 -2px 0 var(--sel); }
  .btn.ghost { background:transparent; border-color:transparent; color:var(--tx2); }
  .btn.danger svg.ic { color:var(--danger); }
  .btn .kc { position:absolute; right:1px; bottom:0; font-size:9px; line-height:10px; color:var(--tx3); }
  .btn.big svg.ic { width:22px; height:22px; } .btn.lab { flex-direction:column; width:auto; min-width:54px; height:52px; padding:0 6px; gap:1px; justify-content:center; } .btn.lab .bl { font-size:11px; line-height:12px; color:var(--tx2); } .btn.lab .kc { position:absolute; right:3px; top:1px; bottom:auto; }
  #topbar .btn:not(.ico) { height:28px; padding:0 10px; } #topbar .btn .bl { font-size:12px; }
  input[type=number], input[type=text], select { background:var(--s2); color:var(--tx); border:1px solid var(--line); border-radius:var(--r1); padding:2px 6px; font:inherit; min-height:24px; }
  input[type=number] { width:64px; } select { color-scheme:dark; }
  input[type=checkbox] { accent-color:var(--ok); }
  #htip { position:fixed; z-index:30; pointer-events:none; background:var(--s2); border-radius:var(--r2); box-shadow:var(--e2); padding:6px 10px; max-width:300px; font-size:12.5px; line-height:1.4; }
  #htip b { font-weight:600; } #htip div { color:var(--tx2); margin-top:2px; } #htip kbd { margin-left:8px; }

  /* ===== the HUD grid (§5): one composition, fixed slots; nothing floats on its own ===== */
  #hud { position:fixed; inset:0; pointer-events:none; z-index:3; }
  #hud > * { pointer-events:auto; zoom:var(--ui); }
  #hud > #notables, #hud > #plate, #hud > #guide, #hud > #gauge, #hud > #dock, #hud > #whisper, #hud > #slotV, #hud > #slotI { pointer-events:none; } #dock > *, #gauge > *, #plate > * { pointer-events:auto; }      /* layers that only hold things never catch a press meant for the map (right/middle-drag pans) */
  #topbar { position:absolute; left:0; right:0; top:0; height:var(--tb); display:flex; gap:var(--sp2); align-items:center; white-space:nowrap; padding:0 var(--sp3); background:var(--s1); box-shadow:0 1px 0 var(--line); z-index:5; }
  #topbar .tb-sep { width:1px; height:20px; background:var(--line); margin:0 var(--sp1); }
  #topbar .tb-spacer { flex:1; }
  #topbar .tb-day { font-size:12px; color:var(--tx2); min-width:44px; }
  #topbar .tb-dev { display:none; align-items:center; gap:3px; } body.dev #topbar .tb-dev { display:inline-flex; }
  #topbar .tb-prog { color:var(--sel); font-size:12px; }
  .dial { display:block; flex:none; } .dial .ring-s { fill:none; stroke-width:4; } .dial .hand { stroke:var(--tx); stroke-width:2; stroke-linecap:round; } .dial .sunm { fill:var(--sel); }
  .dial .s0 { stroke:var(--food); } .dial .s1 { stroke:var(--warm); } .dial .s2 { stroke:#d9803a; } .dial .s3 { stroke:var(--cold); } .dial .s3h { stroke:var(--s2); stroke-width:4; stroke-dasharray:2 3; fill:none; }
  .dial .face { fill:var(--s2); stroke:var(--line); } .dial .night { fill:#0f1528; } .dial .flash { animation:dflash .9s ease-out 1; } @keyframes dflash { from { opacity:1 } to { opacity:.3 } }
  .pop { position:absolute; right:0; top:34px; min-width:180px; background:var(--s2); border-radius:var(--r2); box-shadow:var(--e2); padding:var(--sp2); z-index:9; display:none; }
  .pop.open { display:block; }
  .tb-menuwrap { position:relative; }
  .pop.menu { width:300px; right:0; } .pop button[data-m] { display:flex; width:100%; text-align:left; margin-bottom:4px; } .pop .mrow { display:flex; gap:8px; align-items:center; margin:8px 0 4px; }
  .pop label.mrow { gap:6px; } .pop .autos { margin:4px 0; } .pop .autos button { font-size:12px; display:flex; width:100%; margin-bottom:3px; text-align:left; } .pop .autos .atxt { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pop.menu .mrow { flex-wrap:wrap; min-width:0; } .pop.menu .mrow b { overflow-wrap:anywhere; } .pop.menu .saveinfo { overflow-wrap:anywhere; white-space:normal; } .pop.menu button { min-width:0; } .pop.menu { box-sizing:border-box; overflow-x:hidden; }      /* nothing in the Menu may run past its edge */
  .pop .layers { display:flex; gap:var(--sp1); }
  .pop .lbl, .lbl { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--tx2); margin:var(--sp2) 0 var(--sp1); }

  .slot { position:absolute; top:calc(var(--tb) + 8px); display:flex; flex-direction:column; gap:var(--sp2); overflow-y:auto; scrollbar-width:thin; pointer-events:none; }
  .slot { pointer-events:none; } .slot > * { pointer-events:auto; flex:none; }      /* the empty part of a column belongs to the map */
  #slotV { left:8px; width:var(--colL); bottom:calc(var(--mm) + 16px); }
  #slotI { right:8px; width:var(--colR); bottom:269px; }      /* the Inspector column ends above the depth gauge, which owns the bottom-right corner */
  body.nopanels #hud > * { display:none !important; }

  /* ===== one panel chrome (§2.2) ===== */
  .pn { background:var(--s1); border-radius:var(--r2); box-shadow:var(--e1); }
  .pn > header { display:flex; gap:var(--sp2); align-items:center; padding:0 var(--sp3); height:32px; cursor:pointer; user-select:none; font-weight:600; border-bottom:1px solid var(--line); }
  .pn > header .pi { color:var(--tx2); display:inline-flex; } .pn > header .ptitle { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pn > header .phint { margin-left:auto; color:var(--tx2); font-weight:400; font-size:12px; } .pn > header .phint:empty { display:none; }
  .pn > header .phint.badge { background:var(--s3); border-radius:var(--rp); padding:0 7px; color:var(--tx); font-weight:600; font-size:11.5px; }
  .pn > header .chev { color:var(--tx2); display:inline-flex; transition:transform .12s; } .pn.closed > header .chev { transform:rotate(-90deg); }
  .pn.closed > header { border-bottom:0; } .pn.closed > .pbody { display:none; }
  .pn.flat > header { display:none; }
  .pbody { padding:var(--sp3); } .pbody p { margin:3px 0; }
  .pn.flash { box-shadow:0 0 0 2px var(--know), var(--e1); }
  .sub { margin:var(--sp3) 0 var(--sp1); color:var(--tx2); font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; }
  .chronbody { max-height:250px; overflow-y:auto; scrollbar-width:thin; }
  .sheet { position:fixed; inset:0; background:rgba(5,8,12,.6); z-index:12; display:none; align-items:center; justify-content:center; zoom:var(--ui); }
  .sheet > .card { width:760px; max-width:94vw; max-height:90vh; min-height:300px; overflow-y:auto; background:var(--s1); border-radius:var(--r2); box-shadow:var(--e2); padding:var(--sp4) var(--sp5); position:relative; background:#12171e; }
  .sheet .xbtn { position:absolute; top:var(--sp3); right:var(--sp3); }

  /* meters, rings, pips, chips (§2.4) */
  .mt { position:relative; display:block; height:8px; background:var(--bg); border:1px solid var(--line); border-radius:var(--rp); overflow:hidden; min-width:40px; }
  .mt > i { position:absolute; left:0; top:0; bottom:0; border-radius:var(--rp); }
  .mt .mk { position:absolute; top:0; bottom:0; width:2px; margin-left:-1px; background:rgba(255,255,255,.5); } .mt .mk.soft { background:repeating-linear-gradient(var(--sel) 0 2px, transparent 2px 4px); } .mt .mk.crit { background:var(--danger); width:3px; }
  .mt .mk.tgt { background:#fff; width:3px; } .mt .mk.mid { background:rgba(255,255,255,.35); }
  .nr { position:relative; display:inline-flex; align-items:center; justify-content:center; flex:none; }
  .nr svg:first-child { position:absolute; inset:0; } .nr .bg { fill:var(--s2); stroke:var(--line); stroke-width:3; } .nr .fg { fill:none; stroke-width:3; stroke-linecap:butt; } .nr .tk { stroke:var(--tx); stroke-width:1.2; opacity:.7; }
  .nr.ok .fg { stroke:var(--ok); } .nr.soft .fg { stroke:var(--warm); } .nr.crit .fg { stroke:var(--danger); } .nr.crit { animation:pulse 1.4s ease-in-out infinite; }
  .nr .nr-i { position:relative; color:var(--tx); } .nr.crit .nr-i { color:var(--danger); }
  @keyframes pulse { 50% { opacity:.55; } }
  .mana { display:flex; align-items:center; gap:6px; font-weight:600; } .mana i { width:10px; height:10px; border-radius:50%; background:#9a6bff; box-shadow:0 0 0 2px rgba(154,107,255,.3); flex:none; } .mana.m3 i { background:var(--warm); } .mana.m4 i { background:var(--danger); }
  .pip { vertical-align:-1px; flex:none; } .pip.p1 { color:var(--water); } .pip.p2 { color:var(--warm); } .pip.p3 { color:var(--danger); animation:pulse 1.4s ease-in-out infinite; }
  .rk { display:inline-flex; gap:2px; } .rk i { width:6px; height:6px; border-radius:50%; border:1px solid var(--tx3); } .rk i.f { background:var(--water); border-color:var(--water); } .rk i.h { background:linear-gradient(90deg, var(--water) 50%, transparent 50%); border-color:var(--water); }
  .rk.rusty i.f { background:repeating-linear-gradient(45deg, var(--rot) 0 2px, #b98c5c 2px 4px); border-color:var(--rot); }
  .chip { display:inline-flex; align-items:center; gap:4px; height:24px; padding:0 7px; background:var(--s2); border:1px solid var(--line); border-radius:var(--rp); font-size:12px; } .chip b { font-weight:600; } .chip .cap { color:var(--tx2); }
  .av { flex:none; vertical-align:middle; }
  .sg { display:flex; gap:2px; height:8px; border-radius:var(--rp); overflow:hidden; } .sg i { background:var(--tx3); } .sg i.ok { background:var(--ok); } .sg i.bad { background:var(--danger); } .sg i.idle { background:var(--tx3); }
  .era-b { display:inline-flex; width:22px; height:22px; border-radius:var(--r1); border:1px solid var(--line); align-items:center; justify-content:center; font-size:11px; font-weight:600; color:var(--tx3); } .era-b.on { color:var(--sel); border-color:var(--sel); }

  /* ===== legacy content classes, re-tokenised (panels that still render rows of facts) ===== */
  .bar { position:relative; height:12px; background:var(--bg); border:1px solid var(--line); border-radius:var(--rp); overflow:hidden; min-width:60px; }
  .bar > i { position:absolute; left:0; top:0; bottom:0; } .bar > span { position:relative; display:block; text-align:right; padding-right:4px; font-size:10px; line-height:11px; text-shadow:0 0 3px #000, 0 0 3px #000; }
  .bar .mk { position:absolute; top:0; bottom:0; width:2px; margin-left:-1px; background:rgba(255,255,255,.55); } .bar .mk.crit { background:var(--danger); } .bar .mk.soft { background:var(--sel); } .bar .mk.tgt { background:#fff; width:3px; } .bar .mk.mid { background:rgba(255,255,255,.35); }
  .grid { display:grid; grid-template-columns:78px 1fr; gap:3px 8px; align-items:center; }
  .kv { display:grid; grid-template-columns:78px 1fr; gap:2px 8px; margin-top:7px; } .kv span { color:var(--tx2); } .kv b { font-weight:500; }
  .btnrow { display:flex; gap:5px; margin:6px 0 0; flex-wrap:wrap; }
  .badge { display:inline-block; padding:0 6px; border-radius:var(--rp); color:#0b0e13; font-weight:600; font-size:11.5px; vertical-align:1px; } .badge.next { background:var(--s3); color:var(--sel); border:1px solid var(--sel); }
  details.parts { margin:8px 0 0; } details summary { cursor:pointer; color:var(--tx2); list-style:none; } details summary::-webkit-details-marker { display:none; }
  details table { margin:4px 0; border-collapse:collapse; width:100%; } details td { padding:1px 4px; } td.num { text-align:right; } td.neg { color:var(--danger); }
  a.lnk { color:var(--water); cursor:pointer; text-decoration:underline dotted; } ul.rej { margin:0 0 0 16px; } ul.rej li { margin:2px 0; } .warnline { color:var(--warm); } .fx { margin:4px 0; }
  .ttl.stale { opacity:.5; }
  .ttl { display:inline-block; background:var(--s3); border:1px solid var(--know); border-radius:var(--rp); padding:0 7px; margin:1px 2px; font-size:11px; }
  i.rusty { font-style:normal; font-size:10px; color:var(--rot); border:1px solid var(--rot); border-radius:6px; padding:0 4px; margin-left:3px; } i.star { color:var(--sel); font-style:normal; }
  .alm-craft { padding:5px 0; border-bottom:1px solid var(--line); } .alm-holders { display:flex; flex-wrap:wrap; gap:3px; margin-top:3px; }
  .alm-graph { display:grid; grid-template-columns:1fr 1fr; gap:2px 8px; margin:2px 0 6px; } .alm-g { font-size:12px; color:var(--tx3); } .alm-g.known { color:var(--ok); } .alm-g.open { color:var(--warm); } .alm-g b { display:inline-block; width:1.5em; }
  .alm-flow { margin:2px 0 6px; color:var(--tx3); } .alm-flow .on { color:var(--sel); font-weight:600; } .alm-flow .past { color:var(--ok); }
  .alm-risk { background:rgba(255,107,74,.2); color:var(--danger); border:1px solid var(--danger); border-radius:3px; padding:0 4px; font-size:11px; }
  .alm-curio { margin:4px 0; padding:4px 7px; border-left:3px solid var(--know); background:rgba(199,155,255,.08); }
  pre.alm-trace { margin:4px 0 0; padding:5px; max-height:160px; overflow:auto; font-size:10.5px; line-height:1.35; background:var(--bg); border:1px solid var(--line); white-space:pre-wrap; }
  .chips { display:flex; flex-wrap:wrap; gap:3px; margin-bottom:6px; } .chips button { padding:0 7px 0 4px; }
  .idrow { display:flex; gap:8px; align-items:flex-start; }
  .cr-list { max-height:44vh; overflow-y:auto; scrollbar-width:thin; } .cr-make { display:flex; gap:5px; margin-bottom:6px; } .cr-make input { flex:1; min-width:0; } .cr-chev { padding:0 6px; }
  .crew { padding:6px 0; border-bottom:1px solid var(--line); } .crew.folded { padding:3px 0; } .crew select { width:100%; margin-top:4px; } .cr-sum { margin:3px 0; color:var(--water); font-size:12.5px; }
  .purposes { flex-wrap:wrap; } .purposes button { flex:1; }
  ul.checks { list-style:none; margin:2px 0 6px; } ul.checks li { margin:3px 0; } ul.checks b { display:inline-block; width:16px; font-weight:800; } ul.checks li.ok b { color:var(--ok); } ul.checks li.no b { color:var(--danger); }
  .q-poor { color:var(--danger); } .q-adequate { color:var(--warm); } .q-good, .q-fine { color:var(--ok); }
  .bp { padding:5px 0; border-bottom:1px solid var(--line); } .bp .rev { color:var(--sel); } .bp .pushed { color:var(--ok); } .bp .btnrow { align-items:center; } .bp label.auto { font-size:12px; display:flex; gap:3px; align-items:center; }
  .ce { padding:2px 0; border-bottom:1px solid var(--line); display:flex; gap:6px; align-items:flex-start; } .ce[data-a] { cursor:pointer; } .ce[data-a]:hover { background:var(--s2); }
  .ce .when { color:var(--tx2); font-size:11.5px; white-space:nowrap; } .ce.s2 { color:#ffb3a0; } .ce.s0 { color:var(--tx2); } .ce svg { margin-top:2px; color:var(--tx2); }
  .iron { color:var(--danger); font-weight:700; }
  .ctxmenu { position:fixed; z-index:20; background:var(--s2); border-radius:var(--r2); box-shadow:var(--e2); padding:4px; display:flex; flex-direction:column; gap:3px; } .ctxmenu button { text-align:left; min-width:170px; }

  /* ===== villager strip (the roster along the top) ===== */
  #notables { position:absolute; top:calc(var(--tb) + 4px); left:calc(var(--colL) + 16px); right:calc(var(--colR) + 16px); display:flex; flex-wrap:wrap; gap:4px; pointer-events:none; justify-content:center; }
  #notables > * { pointer-events:auto; } #notables.scroll { max-height:46vh; overflow-y:auto; align-content:flex-start; }
  .ntf { display:flex; gap:3px; margin-right:6px; } .ntf button, .ntf-all { font-size:12px; padding:0 7px; min-height:22px; }
  .nt { display:flex; align-items:center; gap:4px; background:var(--s1); padding:0 7px 0 4px; border-radius:var(--rp); height:24px; box-shadow:var(--e0); } .nt.on { box-shadow:0 0 0 2px var(--sel); }
  .nt .nn { font-size:12px; } .nt .al { display:flex; gap:2px; } .nt .al svg { color:var(--warm); } .nt .ti { color:var(--sel); }
  .more { align-self:center; color:var(--tx2); font-size:12px; background:var(--s1); padding:1px 8px; border-radius:var(--rp); }

  /* ===== village HUD (§3.3) ===== */
  .vh-count { display:flex; align-items:baseline; gap:var(--sp2); } .vh-count b { font-size:20px; font-weight:600; }
  .pips { display:flex; flex-wrap:wrap; gap:2px; margin:var(--sp1) 0; } .pips i { width:5px; height:9px; border-radius:2px; background:var(--tx2); } .pips i.k { height:6px; background:var(--tx3); margin-top:3px; } .pips i.e { background:var(--cold); }
  .ribbon { position:relative; display:flex; height:14px; margin:var(--sp2) 0 var(--sp1); border-radius:var(--r1); overflow:hidden; border:1px solid var(--line); }
  .ribbon i { flex:1; } .ribbon i.s0 { background:#3d5a2a; } .ribbon i.s1 { background:#6a5521; } .ribbon i.s2 { background:#6b3f1d; } .ribbon i.s3 { background:repeating-linear-gradient(45deg,#2b4358 0 3px,#223548 3px 6px); }
  .ribbon .now { position:absolute; top:-1px; bottom:-1px; width:2px; background:var(--tx); margin-left:-1px; }
  .runway { position:relative; height:16px; background:var(--bg); border:1px solid var(--line); border-radius:var(--r1); overflow:hidden; margin:var(--sp1) 0; }
  .runway .fill { position:absolute; left:0; top:0; bottom:0; } .runway .short { position:absolute; top:0; bottom:0; background:repeating-linear-gradient(45deg, rgba(255,107,74,.75) 0 3px, rgba(255,107,74,.25) 3px 6px); }
  .runway .wm { position:absolute; top:0; bottom:0; width:2px; background:var(--cold); } .runway .wm svg { position:absolute; top:1px; left:-7px; color:var(--cold); } .runway .cn { position:absolute; top:0; bottom:0; width:2px; background:var(--danger); }
  .runway .val { position:absolute; right:5px; top:0; font-size:11px; line-height:14px; font-weight:600; text-shadow:0 0 3px #000, 0 0 3px #000; }
